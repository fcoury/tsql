name: Publish tsql 0.7.0 recovery

on:
  push:
    branches:
      - agent/fix-crates-index-check

permissions:
  contents: read

jobs:
  publish:
    name: Publish tsql 0.7.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.7.0
        uses: actions/checkout@v4
        with:
          ref: v0.7.0
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "tsql"))')
          test "$VERSION" = "0.7.0"

      - name: Check publication state
        id: publication
        run: |
          if CARGO_TERM_COLOR=never cargo search tsql --limit 1 | grep -q 'tsql = "0.7.0"'; then
            echo "tsql 0.7.0 is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish tsql
        if: steps.publication.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p tsql
